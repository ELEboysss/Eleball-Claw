# Eleball-claw 本地网关配置
# claw 本地运行：本地 SQLite、不启用管理后台 / 支付 / 邮件、本地不计费。
# server.eleagent_base_url 指向云端 api.eleball.cn/v1（Ele Agent 模型转发至云端）。
# 云端地址（cloud_base / cloud_api）供 web 双通道与 auth 转发用，P2 实现，gateway 侧暂不需要。

server:
  port: 8090
  mode: debug
  # Ele Agent 模型经此 BaseURL 转发至云端
  eleagent_base_url: "https://api.eleball.cn/v1"

database:
  driver: sqlite
  # 本地 SQLite，claw 数据自主可控
  dsn: "data/claw.db"

cdk_database:
  driver: sqlite
  dsn: "data/cdk.db"

jwt:
  # 本地 JWT 密钥。安装脚本会生成随机值；本地验签失败的 token 会自动回退到
  # 云端 /auth/me 验证（见 middleware.JWTAuthCloudFallback），因此无需与云端一致。
  # 与云端共享密钥（内网/同部署）时可走本地验签快路径。
  secret: "change-me-in-claw-production"
  access_expire_hours: 2
  refresh_expire_hours: 720

llm:
  timeout: 120s
  max_retries: 3

asr:
  provider: "baidu"
  app_id: ""
  api_key: ""
  secret_key: ""
  base_url: "https://vop.baidu.com"
  timeout: 30s
  max_audio_mb: 10

rate_limit:
  requests_per_minute: 180
  read_multiplier: 3.0

release:
  root_path: "releases"

agent:
  enabled: true
  base_path: "data/sessions"
  knowledge_base: "data/knowledge_base"
  model: "gpt-4o-mini"
  max_steps: 500
  # AR-03：单次 Agent 执行的 token 预算上限（累计 prompt+completion），超限强制进入最终回答。
  # 0 表示不限制。默认 60000，防止单次失控执行耗尽用户弹丸。
  max_tokens_per_execute: 60000
  # C4：对话级上下文压缩配置
  compaction:
    enabled: true
    threshold_tokens: 60000
    keep_recent_tokens: 20000
    fallback_model: ""
  # C8：项目记忆文件（CLAUDE.md / AGENTS.md）自动注入配置
  context_files:
    enabled: true
    max_total_chars: 12000
    max_file_chars: 8000
    rules_enabled: false
  # BYOK 兜底：未配置用户自有 Key 时使用（本地开发）
  api_key: ""
  base_url: ""

# E2：工具权限配置。claw 本地以权限确认模型替代云端白名单沙箱。
# mode 为新会话的默认权限模式，用户可在前端 Shift+Tab 切换并持久化到会话：
#   default     逐个确认（只读自动放行，写/Shell 询问）—— 默认
#   acceptEdits 文件编辑自动放行，Shell/构建仍询问
#   plan        只读模式 + 计划流程（ExitPlanMode 接受后切 acceptEdits）
#   auto        全自动（仅危险操作黑名单与 deny 规则拦截）
#   strict      全确认（含只读，每次询问）
permission:
  mode: default

agent_reach:
  # 本地预置模块的探测客户端配置；第三方模块拉镜像后按 modules 表独立维护地址
  module_url: ""
  health_check_interval: 30s
  probe_interval: 5m
  proxy: ""

modules:
  # 预置模块（marketplace 下含 docker-compose.yml 者）随 serve 自动上下线。
  # auto_start：启动后后台自动上线（拉镜像优先、本地构建兜底，不阻塞网关；无 docker 仅告警跳过）
  # auto_stop：收到退出信号时 docker compose down 本网关启动的模块
  auto_start: true
  auto_stop: true
  # 镜像命名空间前缀（env MODULES_REGISTRY），与 CI build-modules 推送的阿里云 ACR 一致；
  # 自行修改时需同步调整各模块 docker-compose.yml 的 image 字段
  registry: crpi-2tmk9w177nykk4zb.cn-hangzhou.personal.cr.aliyuncs.com/eleball
  # 镜像标签（env MODULES_IMAGE_TAG），与 CI 滚动标签一致
  image_tag: develop
  # 上线策略（env MODULES_PULL_POLICY）：
  #   pull_first（默认）先 docker pull，失败回退本地构建；build_only 仅本地构建；pull_only 仅拉镜像、失败不回退
  pull_policy: pull_first
  # 本地子进程（process deployment，如 stdio MCP）沙箱配置，详见 docs/claw-process-runtime.md
  # 无 docker 时 claw 可经 process 模式运行官方/用户脚本与 stdio MCP server
  process_sandbox:
    # 允许的工作目录前缀（marketplace home 与用户工作目录；~ 由 claw 启动时展开）
    allowed_work_dirs:
      - "~/.eleball-claw/marketplace"
      - "~/.eleball-claw/workspace"
    # 允许透传给子进程的环境变量白名单（防止泄露云凭证）
    allowed_env_keys:
      - "PATH"
      - "HOME"
      - "USERPROFILE"
      - "USER"
      - "LANG"
      - "PYTHONPATH"
      - "NODE_PATH"
    # 最大并发子进程数
    max_processes: 10
    # 启动超时
    timeout: 30s

admin:
  enabled: false
  ip_whitelist_enabled: false
  allowed_ips: []

admin_gate:
  enabled: false

payment:
  order_expire_minutes: 30
  alipay:
    enabled: false

mail:
  enabled: false
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
