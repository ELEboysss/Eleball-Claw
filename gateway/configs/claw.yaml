# Eleball-claw 本地网关配置
# claw 本地运行：本地 SQLite、不启用管理后台 / 支付 / 邮件、本地不计费。
# server.eleagent_base_url 指向云端 api.eleball.cn/v1（Ele Agent 模型转发至云端）。
# 云端地址（cloud_base / cloud_api）供 web 双通道与 auth 转发用，P2 实现，gateway 侧暂不需要。

server:
  port: 8090
  mode: debug
  # Ele Agent 模型经此 BaseURL 转发至云端
  eleagent_base_url: "https://api.eleball.cn/v1"

database:
  driver: sqlite
  # 本地 SQLite，claw 数据自主可控
  dsn: "data/claw.db"

cdk_database:
  driver: sqlite
  dsn: "data/cdk.db"

jwt:
  # 本地 JWT 密钥。安装脚本会生成随机值；本地验签失败的 token 会自动回退到
  # 云端 /auth/me 验证（见 middleware.JWTAuthCloudFallback），因此无需与云端一致。
  # 与云端共享密钥（内网/同部署）时可走本地验签快路径。
  secret: "change-me-in-claw-production"
  access_expire_hours: 2
  refresh_expire_hours: 720

llm:
  timeout: 120s
  max_retries: 3

asr:
  provider: "baidu"
  app_id: ""
  api_key: ""
  secret_key: ""
  base_url: "https://vop.baidu.com"
  timeout: 30s
  max_audio_mb: 10

rate_limit:
  requests_per_minute: 180
  read_multiplier: 3.0

release:
  root_path: "releases"

agent:
  enabled: true
  base_path: "data/sessions"
  knowledge_base: "data/knowledge_base"
  model: "gpt-4o-mini"
  max_steps: 500
  # BYOK 兜底：未配置用户自有 Key 时使用（本地开发）
  api_key: ""
  base_url: ""

agent_reach:
  # 本地预置模块的探测客户端配置；第三方模块拉镜像后按 modules 表独立维护地址
  module_url: ""
  health_check_interval: 30s
  probe_interval: 5m
  proxy: ""

modules:
  # 预置模块（marketplace 下含 docker-compose.yml 者）随 serve 自动上下线。
  # auto_start：启动后后台自动上线（拉镜像优先、本地构建兜底，不阻塞网关；无 docker 仅告警跳过）
  # auto_stop：收到退出信号时 docker compose down 本网关启动的模块
  auto_start: true
  auto_stop: true
  # 镜像命名空间前缀（env MODULES_REGISTRY），与 CI build-modules 推送的阿里云 ACR 一致；
  # 自行修改时需同步调整各模块 docker-compose.yml 的 image 字段
  registry: crpi-2tmk9w177nykk4zb.cn-hangzhou.personal.cr.aliyuncs.com/eleball
  # 镜像标签（env MODULES_IMAGE_TAG），与 CI 滚动标签一致
  image_tag: develop
  # 上线策略（env MODULES_PULL_POLICY）：
  #   pull_first（默认）先 docker pull，失败回退本地构建；build_only 仅本地构建；pull_only 仅拉镜像、失败不回退
  pull_policy: pull_first

admin:
  enabled: false
  ip_whitelist_enabled: false
  allowed_ips: []

admin_gate:
  enabled: false

payment:
  order_expire_minutes: 30
  alipay:
    enabled: false

mail:
  enabled: false
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
