# firecrawl 模块编排（claw 宿主机模式）
# 官方预置：claw 扫描 marketplace/firecrawl/module.json 自动注册。
# 经 `eleball-claw module up firecrawl` 或 docker compose up -d 启动；
# 端口发布到宿主机 8093，claw（宿主机进程）经 http://localhost:8093 调用。

services:
  firecrawl:
    build: .
    # 与 claw 自动上线「拉镜像优先」对齐：image 命名 = <modules.registry>/<模块名>:<modules.image_tag>，
    # 默认指向 CI 推送的阿里云 ACR develop 滚动标签；保留 build 作为本地构建兜底。
    image: crpi-2tmk9w177nykk4zb.cn-hangzhou.personal.cr.aliyuncs.com/eleball/firecrawl:develop
    container_name: eleball-firecrawl
    ports:
      - "8093:8080"
    environment:
      - PORT=8080
      # 默认使用 Firecrawl Cloud API（推荐，最轻量）。
      # Firecrawl API Key 也可以在网关侧按 SKU 由用户自行填写（通过 credentials.firecrawl_api_key 传入），
      # 这里的环境变量仅作为模块级兜底，方便未配置 SKU 凭证时的快速测试。
      - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
