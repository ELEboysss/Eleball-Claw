# Firecrawl 模块编排（claw 宿主机模式）
# 官方预置：claw 扫描 marketplace/firecrawl/module.json 自动注册。
# 经 `eleball-claw module up firecrawl` 或 docker compose up -d 启动；
# 端口发布到宿主机 8095，claw（宿主机进程）经 http://localhost:8095 调用。

services:
  firecrawl:
    build: .
    # 与 claw 自动上线「拉镜像优先」对齐：image 命名 = <modules.registry>/<模块名>:<modules.image_tag>，
    # 默认指向 CI 推送的阿里云 ACR develop 滚动标签；保留 build 作为本地构建兜底。
    image: crpi-2tmk9w177nykk4zb.cn-hangzhou.personal.cr.aliyuncs.com/eleball/firecrawl:develop
    container_name: eleball-firecrawl
    ports:
      - "8095:8080"
    environment:
      - FIRECRAWL_BASE_URL=https://api.firecrawl.dev
    restart: unless-stopped
    healthcheck:
      # python:3-slim 无 curl，用 stdlib 探活 /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
