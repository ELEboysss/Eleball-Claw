# Agent-Reach 模块编排（claw 宿主机模式）
# 官方预置：claw 扫描 marketplace/agent-reach/module.json 自动注册。
# 经 `eleball-claw module up agent-reach` 或 docker compose up -d 启动；
# 端口发布到宿主机 8094，claw（宿主机进程）经 http://localhost:8094 调用。

services:
  agent-reach:
    build: .
    container_name: eleball-agent-reach
    ports:
      - "8094:8080"
    volumes:
      # 模块执行期间产生的临时 Cookie/数据目录
      - ./data/cookies:/data/cookies
    environment:
      - AGENT_REACH_DATA_ROOT=/data/cookies
      # 可选代理（访问 Twitter/Reddit 受限平台时使用）
      # - HTTP_PROXY=http://user:pass@host:port
      # - HTTPS_PROXY=http://user:pass@host:port
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
