<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eleball 管理后台 · 访问验证</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 2.25rem 2rem;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    letter-spacing: 0.5px;
  }
  .logo span { color: #6366f1; }
  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 1.75rem;
  }
  .field { margin-bottom: 1rem; }
  label {
    display: block;
    font-size: 0.8rem;
    color: #cbd5e1;
    margin-bottom: 0.4rem;
  }
  input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.95rem;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    transition: border-color 0.15s;
  }
  input:focus { outline: none; border-color: #6366f1; }
  input::placeholder { color: #475569; }
  button {
    width: 100%;
    padding: 0.75rem;
    margin-top: 0.5rem;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    min-height: 1.2rem;
    margin-top: 0.75rem;
    font-size: 0.82rem;
    text-align: center;
    color: #f87171;
  }
  .msg.ok { color: #34d399; }
  .footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.72rem;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Ele<span>ball</span></div>
    <div class="subtitle">管理后台 · 访问验证</div>
    <form id="gateForm" autocomplete="off">
      <div class="field">
        <label for="token">访问口令</label>
        <input id="token" name="token" type="password" placeholder="输入访问口令" autofocus />
      </div>
      <button type="submit" id="btn">验证并进入</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="footer">仅授权人员可访问</div>
  </div>
<script>
(function(){
  var form = document.getElementById('gateForm');
  var input = document.getElementById('token');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var token = input.value.trim();
    if(!token){ msg.textContent = '请输入访问口令'; return; }
    btn.disabled = true; msg.textContent = ''; msg.className = 'msg';
    fetch('/_admin_gate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({token: token})
    }).then(function(r){
      return r.json().then(function(d){ return {status:r.status, data:d}; });
    }).then(function(res){
      if(res.status === 200 && res.data && res.data.code === 0){
        msg.textContent = '验证成功，正在进入…';
        msg.className = 'msg ok';
        // 跳转登录页（cookie 已由服务端设置）
        window.location.href = (res.data.data && res.data.data.redirect) || '/admin/';
      } else {
        btn.disabled = false;
        var m = (res.data && res.data.message) || '口令错误';
        if(res.status === 429){ m = '尝试过于频繁，请稍后再试'; }
        msg.textContent = m;
      }
    }).catch(function(){
      btn.disabled = false;
      msg.textContent = '网络异常，请重试';
    });
  });
})();
</script>
</body>
</html>
